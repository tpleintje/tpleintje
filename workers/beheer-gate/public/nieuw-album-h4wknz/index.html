<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>'t Pleintje — Fotogalerijen beheren</title>
<style>
  :root {
    --roze:        #e8829a;
    --roze-licht:  #fce8ed;
    --roze-donker: #c45e78;
    --rood:        #c4495e;
    --rood-licht:  #fce8ea;
    --grijs:       #f7f7f7;
    --tekst:       #333;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    color: var(--tekst);
    background: #fff;
    font-size: 16px;
    line-height: 1.6;
    margin: 0;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 {
    font-size: 1.7rem;
    color: var(--roze-donker);
    font-style: italic;
    margin: 0 0 0.3rem;
  }
  .uitleg { color: #777; margin: 0 0 1.6rem; font-size: 0.96rem; }

  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.8rem; border-bottom: 2px solid var(--roze-licht); }
  .tab-knop {
    background: none; border: none; cursor: pointer;
    padding: 0.6rem 0.2rem; margin-bottom: -2px;
    font-size: 0.98rem; font-weight: 600; color: #999;
    border-bottom: 2px solid transparent; font-family: inherit;
  }
  .tab-knop + .tab-knop { margin-left: 1.2rem; }
  .tab-knop.actief { color: var(--roze-donker); border-bottom-color: var(--roze-donker); }
  .tab-paneel { display: none; }
  .tab-paneel.actief { display: block; }

  .veld { margin-bottom: 1.4rem; }
  .veld label {
    display: block;
    font-weight: 600;
    color: var(--roze-donker);
    margin-bottom: 0.35rem;
    font-size: 0.95rem;
  }
  input[type=text], select {
    width: 100%;
    padding: 0.65rem 0.8rem;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
    background: #fff;
  }
  input[type=text]:focus, select:focus { outline: 2px solid var(--roze); border-color: var(--roze); }

  .dropzone {
    border: 2px dashed #e0b8c2;
    border-radius: 12px;
    background: var(--roze-licht);
    padding: 2rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .dropzone.hover { background: #fbd6e0; border-color: var(--roze-donker); }
  .dropzone p { margin: 0; color: var(--roze-donker); font-weight: 600; }
  .dropzone .sub { color: #999; font-size: 0.85rem; font-weight: 400; margin-top: 0.3rem; }
  #bestandinvoer, #bestandinvoerBewerk { display: none; }

  .fotolijst {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 0.6rem;
    margin-top: 1rem;
  }
  .fotolijst .item { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #eee; }
  .fotolijst img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fotolijst .verwijder {
    position: absolute; top: 3px; right: 3px;
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(0,0,0,0.6); color: #fff; border: none;
    font-size: 0.85rem; line-height: 1; cursor: pointer;
  }

  .album-preview {
    margin-top: 1rem;
    padding: 0.9rem 1.1rem;
    background: var(--grijs);
    border-radius: 10px;
    font-size: 0.9rem;
    color: #555;
    display: none;
  }
  .album-preview.zichtbaar { display: block; }

  button.hoofdknop {
    width: 100%;
    background: var(--roze-donker);
    color: #fff;
    border: none;
    padding: 0.9rem;
    border-radius: 25px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 1.8rem;
    transition: background 0.15s;
  }
  button.hoofdknop:hover:not(:disabled) { background: var(--roze); }
  button.hoofdknop.gevaar { background: var(--rood); }
  button.hoofdknop.gevaar:hover:not(:disabled) { background: #d96678; }
  button.hoofdknop:disabled { background: #ddd; color: #999; cursor: not-allowed; }

  .status {
    margin-top: 1.2rem;
    padding: 0.9rem 1.1rem;
    border-radius: 10px;
    font-size: 0.92rem;
    display: none;
  }
  .status.bezig   { display: block; background: var(--grijs); color: #555; }
  .status.fout    { display: block; background: #fde2e2; color: #a02020; }
  .status.gelukt  { display: block; background: #e3f5e9; color: #1f7a45; }

  .login-melding {
    background: var(--roze-licht);
    border-radius: 12px;
    padding: 1.4rem 1.5rem;
    font-size: 0.96rem;
  }
  .login-melding a.knop, .status.gelukt a.knop {
    display: inline-block;
    margin-top: 0.8rem;
    background: var(--roze-donker);
    color: #fff !important;
    text-decoration: none;
    font-weight: 700;
    padding: 0.55rem 1.1rem;
    border-radius: 20px;
    font-size: 0.9rem;
  }
  .gphotos-rij { margin-top: 0.7rem; }
  button.gphotos-knop {
    background: #fff; color: var(--roze-donker);
    border: 2px solid var(--roze-donker); border-radius: 20px;
    padding: 0.45rem 1rem; font-size: 0.92rem; font-weight: 700;
    font-family: inherit; cursor: pointer;
  }
  button.gphotos-knop:hover:not(:disabled) { background: var(--roze-licht); }
  button.gphotos-knop:disabled { color: #aaa; border-color: #ddd; cursor: not-allowed; }
  .gphotos-status { margin-top: 0.6rem; }
  .gphotos-status a, .gphotos-status button.link {
    color: var(--roze-donker); font-weight: 700; background: none; border: none;
    padding: 0; font: inherit; text-decoration: underline; cursor: pointer;
  }
  #opnieuwChecken {
    background: none; border: none; color: var(--roze-donker); font-weight: 700;
    text-decoration: underline; cursor: pointer; padding: 0; font-size: 0.9rem; margin-top: 0.8rem; display: inline-block;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fotogalerijen beheren</h1>
  <p class="uitleg">Toevoegen, bewerken of verwijderen — geen GitHub of aparte instellingen nodig.</p>

  <div id="loginCheck"></div>

  <div id="tabsEnPanelen" style="display:none">
    <div class="tabs">
      <button type="button" class="tab-knop actief" data-tab="toevoegen">Nieuwe galerij</button>
      <button type="button" class="tab-knop" data-tab="bewerken">Bewerken</button>
      <button type="button" class="tab-knop" data-tab="verwijderen">Galerij verwijderen</button>
    </div>

    <div class="tab-paneel actief" id="paneel-toevoegen">
      <form id="albumForm">
        <div class="veld">
          <label for="titelVeld">Naam van de galerij</label>
          <input type="text" id="titelVeld" placeholder="Bv. Kerstmarkt 2026" autocomplete="off">
        </div>

        <div class="veld">
          <label>Foto's</label>
          <div class="dropzone" id="dropzone">
            <p>Sleep je foto's hierheen</p>
            <p class="sub">of klik om te kiezen — meerdere foto's tegelijk mag</p>
          </div>
          <input type="file" id="bestandinvoer" accept="image/*" multiple>
          <div class="gphotos-rij">
            <button type="button" class="gphotos-knop" data-doel="toevoegen">Importeer uit Google Photos</button>
            <div class="status gphotos-status" id="gphotosStatusToevoegen"></div>
          </div>
          <div class="fotolijst" id="fotolijst"></div>
        </div>

        <div class="veld">
          <label for="bijschriftVeld">Bijschrift (optioneel)</label>
          <input type="text" id="bijschriftVeld" placeholder="Komt onder alle foto's van deze galerij" autocomplete="off">
        </div>

        <button type="submit" class="hoofdknop" id="verzendKnop">Galerij toevoegen</button>
        <div class="status" id="statusToevoegen"></div>
      </form>
    </div>

    <div class="tab-paneel" id="paneel-bewerken">
      <div class="veld">
        <label for="bewerkSelect">Welke galerij wil je bewerken?</label>
        <select id="bewerkSelect">
          <option value="">Galerijen laden…</option>
        </select>
      </div>

      <div id="bewerkFormulier" style="display:none">
        <div class="veld">
          <label for="bewerkTitelVeld">Naam van de galerij</label>
          <input type="text" id="bewerkTitelVeld" placeholder="Bv. Kerstmarkt 2026" autocomplete="off">
        </div>

        <div class="veld">
          <label for="bewerkBijschriftVeld">Bijschrift (optioneel)</label>
          <input type="text" id="bewerkBijschriftVeld" placeholder="Komt onder alle foto's van deze galerij" autocomplete="off">
        </div>

        <div class="veld">
          <label>Foto's</label>
          <div class="fotolijst" id="bewerkFotolijst"></div>
          <div class="dropzone" id="dropzoneBewerk" style="margin-top:1rem">
            <p>Sleep extra foto's hierheen</p>
            <p class="sub">of klik om te kiezen — meerdere foto's tegelijk mag</p>
          </div>
          <input type="file" id="bestandinvoerBewerk" accept="image/*" multiple>
          <div class="gphotos-rij">
            <button type="button" class="gphotos-knop" data-doel="bewerken">Importeer uit Google Photos</button>
            <div class="status gphotos-status" id="gphotosStatusBewerken"></div>
          </div>
        </div>

        <button type="button" class="hoofdknop" id="bewerkOpslaanKnop">Wijzigingen opslaan</button>
      </div>
      <div class="status" id="statusBewerken"></div>
    </div>

    <div class="tab-paneel" id="paneel-verwijderen">
      <div class="veld">
        <label for="albumSelect">Welke galerij wil je verwijderen?</label>
        <select id="albumSelect">
          <option value="">Galerijen laden…</option>
        </select>
      </div>
      <div class="album-preview" id="albumPreview"></div>
      <button type="button" class="hoofdknop gevaar" id="verwijderKnop" disabled>Galerij verwijderen</button>
      <div class="status" id="statusVerwijderen"></div>
    </div>
  </div>
</div>

<script src="gphotos-import.js"></script>
<script>
(function () {
  "use strict";

  const REPO = "tpleintje/tpleintje";
  const BRANCH = "main";
  const SFEER_PAD = "images/sfeer";
  const ALBUMS_JSON_PAD = "src/_data/sfeerbeelden-albums.json";
  const ADMIN_URL = "../beheer-7q3k9x2m/";

  const loginCheck = document.getElementById("loginCheck");
  const tabsEnPanelen = document.getElementById("tabsEnPanelen");
  const form = document.getElementById("albumForm");
  const dropzone = document.getElementById("dropzone");
  const bestandinvoer = document.getElementById("bestandinvoer");
  const fotolijstEl = document.getElementById("fotolijst");
  const statusToevoegen = document.getElementById("statusToevoegen");
  const verzendKnop = document.getElementById("verzendKnop");
  const titelVeld = document.getElementById("titelVeld");
  const bijschriftVeld = document.getElementById("bijschriftVeld");

  const albumSelect = document.getElementById("albumSelect");
  const albumPreview = document.getElementById("albumPreview");
  const verwijderKnop = document.getElementById("verwijderKnop");
  const statusVerwijderen = document.getElementById("statusVerwijderen");

  const bewerkSelect = document.getElementById("bewerkSelect");
  const bewerkFormulier = document.getElementById("bewerkFormulier");
  const bewerkTitelVeld = document.getElementById("bewerkTitelVeld");
  const bewerkBijschriftVeld = document.getElementById("bewerkBijschriftVeld");
  const bewerkFotolijstEl = document.getElementById("bewerkFotolijst");
  const dropzoneBewerk = document.getElementById("dropzoneBewerk");
  const bestandinvoerBewerk = document.getElementById("bestandinvoerBewerk");
  const bewerkOpslaanKnop = document.getElementById("bewerkOpslaanKnop");
  const statusBewerken = document.getElementById("statusBewerken");

  let gekozenBestanden = [];
  let albumsCache = null;
  let albumsMetaCache = null; // raw albums.json data for edit meta
  let bewerkMap = null;
  let bewerkBestaandeFotos = []; // { name, url }
  let bewerkTeVerwijderen = new Set();
  let bewerkNieuweBestanden = [];

  function getToken() {
    try {
      const raw = window.localStorage.getItem("decap-cms-user");
      if (!raw) return null;
      const user = JSON.parse(raw);
      return (user && user.token) ? user.token : null;
    } catch (e) {
      return null;
    }
  }

  function toonLoginStatus() {
    if (getToken()) {
      loginCheck.innerHTML = "";
      tabsEnPanelen.style.display = "block";
      return true;
    }
    tabsEnPanelen.style.display = "none";
    loginCheck.innerHTML =
      '<div class="login-melding">' +
      "Je bent nog niet ingelogd. Log eerst één keer in via Activiteiten (Decap). Daarna werken fotogalerijen hier ook." +
      '<br><a class="knop" href="' + ADMIN_URL + '" target="_blank" rel="noopener">Inloggen via Activiteiten</a>' +
      '<br><a href="../hub-df5d0dd9/" style="display:inline-block;margin-top:0.7rem;color:var(--roze-donker);font-weight:700;">← Terug naar Beheer ’t Pleintje</a>' +
      '<br><button type="button" id="opnieuwChecken">Ik ben ingelogd — controleer opnieuw</button>' +
      "</div>";
    const btn = document.getElementById("opnieuwChecken");
    if (btn) btn.addEventListener("click", toonLoginStatus);
    return false;
  }

  // ── Tabs ──
  document.querySelectorAll(".tab-knop").forEach((knop) => {
    knop.addEventListener("click", () => {
      document.querySelectorAll(".tab-knop").forEach((k) => k.classList.remove("actief"));
      document.querySelectorAll(".tab-paneel").forEach((p) => p.classList.remove("actief"));
      knop.classList.add("actief");
      document.getElementById("paneel-" + knop.dataset.tab).classList.add("actief");
      if (knop.dataset.tab === "verwijderen") laadAlbumSelect();
      if (knop.dataset.tab === "bewerken") laadBewerkSelect();
    });
  });

  // ── Gedeelde hulpfuncties ──
  function slugify(s) {
    return s
      .normalize("NFD").replace(new RegExp("[" + String.fromCharCode(768) + "-" + String.fromCharCode(879) + "]", "g"), "")
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  function titelVanSlug(slug) {
    return slug.replace(/-/g, " ").replace(/(^|\s)\S/g, (c) => c.toUpperCase());
  }

  function sanitizeBestandsnaam(naam) {
    const punt = naam.lastIndexOf(".");
    const basis = punt > 0 ? naam.slice(0, punt) : naam;
    const ext = punt > 0 ? naam.slice(punt).toLowerCase() : "";
    return (slugify(basis) || "foto") + ext;
  }

  function fileNaarBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = () => reject(new Error("Kon " + file.name + " niet lezen."));
      reader.readAsDataURL(file);
    });
  }

  function utf8NaarBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }
  function base64NaarUtf8(str) {
    return decodeURIComponent(escape(atob(str)));
  }

  async function gh(pad, opties) {
    opties = opties || {};
    const token = getToken();
    if (!token) throw new Error("Niet (meer) ingelogd. Log opnieuw in via het beheerpaneel.");
    const headers = Object.assign(
      { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" },
      opties.body ? { "Content-Type": "application/json" } : {},
      opties.headers || {}
    );
    const res = await fetch("https://api.github.com/repos/" + REPO + pad, Object.assign({}, opties, { headers }));
    if (!res.ok) {
      let detail = "";
      try { detail = (await res.json()).message || ""; } catch (e) {}
      throw new Error("GitHub gaf een fout terug (" + res.status + "). " + detail);
    }
    if (res.status === 204) return null;
    return res.json();
  }

  async function haalAlbumsJson() {
    try {
      const bestand = await gh("/contents/" + ALBUMS_JSON_PAD);
      return { data: JSON.parse(base64NaarUtf8(bestand.content)), sha: bestand.sha };
    } catch (e) {
      return { data: { albums: [] }, sha: null };
    }
  }

  async function haalAlbumMappen() {
    const listing = await gh("/contents/" + SFEER_PAD);
    return listing.filter((item) => item.type === "dir").map((item) => item.name);
  }

  async function albumBestaatAl(mapnaam) {
    try {
      const mappen = await haalAlbumMappen();
      return mappen.some((naam) => naam.toLowerCase() === mapnaam);
    } catch (e) {
      return false;
    }
  }

  function zetStatus(el, klasse, tekst) {
    el.className = "status " + klasse;
    el.innerHTML = tekst;
  }

  // ── Tab 1: album toevoegen ──
  function toonFotolijst() {
    fotolijstEl.innerHTML = "";
    gekozenBestanden.forEach((file, i) => {
      const div = document.createElement("div");
      div.className = "item";
      const img = document.createElement("img");
      img.src = URL.createObjectURL(file);
      const knop = document.createElement("button");
      knop.type = "button";
      knop.className = "verwijder";
      knop.textContent = "×";
      knop.title = "Verwijder deze foto";
      knop.addEventListener("click", () => {
        gekozenBestanden.splice(i, 1);
        toonFotolijst();
      });
      div.appendChild(img);
      div.appendChild(knop);
      fotolijstEl.appendChild(div);
    });
  }

  function voegBestandenToe(bestandenLijst) {
    for (const file of bestandenLijst) {
      if (file.type && file.type.startsWith("image/")) gekozenBestanden.push(file);
    }
    toonFotolijst();
  }

  dropzone.addEventListener("click", () => bestandinvoer.click());
  bestandinvoer.addEventListener("change", (e) => voegBestandenToe(e.target.files));
  ["dragenter", "dragover"].forEach((ev) =>
    dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.add("hover"); })
  );
  ["dragleave", "drop"].forEach((ev) =>
    dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.remove("hover"); })
  );
  dropzone.addEventListener("drop", (e) => {
    if (e.dataTransfer && e.dataTransfer.files) voegBestandenToe(e.dataTransfer.files);
  });

  async function voegAlbumToe(titel, bijschrift, bestanden, onVoortgang) {
    const mapnaam = slugify(titel);
    if (!mapnaam) throw new Error("Geef een naam voor de galerij op.");
    if (!bestanden.length) throw new Error("Kies minstens één foto.");

    onVoortgang("Even nakijken of deze galerij al bestaat…");
    if (await albumBestaatAl(mapnaam)) {
      throw new Error("Er bestaat al een galerij met (bijna) deze naam. Kies een net iets andere naam.");
    }

    onVoortgang("Laatste stand van de website ophalen…");
    const ref = await gh("/git/ref/heads/" + BRANCH);
    const laatsteCommitSha = ref.object.sha;
    const laatsteCommit = await gh("/git/commits/" + laatsteCommitSha);
    const baseTree = laatsteCommit.tree.sha;

    const treeEntries = [];
    const gebruikteNamen = new Set();

    for (let i = 0; i < bestanden.length; i++) {
      const file = bestanden[i];
      onVoortgang("Foto " + (i + 1) + " van " + bestanden.length + " voorbereiden…");
      let naam = sanitizeBestandsnaam(file.name);
      let uniekeNaam = naam;
      let teller = 2;
      while (gebruikteNamen.has(uniekeNaam)) {
        const punt = naam.lastIndexOf(".");
        uniekeNaam = punt > 0 ? naam.slice(0, punt) + "-" + teller + naam.slice(punt) : naam + "-" + teller;
        teller++;
      }
      gebruikteNamen.add(uniekeNaam);

      const base64 = await fileNaarBase64(file);
      const blob = await gh("/git/blobs", { method: "POST", body: JSON.stringify({ content: base64, encoding: "base64" }) });
      treeEntries.push({ path: SFEER_PAD + "/" + mapnaam + "/" + uniekeNaam, mode: "100644", type: "blob", sha: blob.sha });
    }

    // Altijd een album-entry in sfeerbeelden-albums.json, zodat de galerij ook in Decap
    // (Sfeerbeelden) verschijnt voor titel/bijschriften per foto.
    onVoortgang("Galerijnaam opslaan…");
    const { data: huidigeData } = await haalAlbumsJson();
    huidigeData.albums = (huidigeData.albums || []).filter((a) => a.map !== mapnaam);
    const nieuwEntry = { map: mapnaam, titel: titel || titelVanSlug(mapnaam) };
    if (bijschrift) nieuwEntry.bijschrift = bijschrift;
    huidigeData.albums.push(nieuwEntry);

    const jsonBlob = await gh("/git/blobs", {
      method: "POST",
      body: JSON.stringify({ content: utf8NaarBase64(JSON.stringify(huidigeData, null, 2)), encoding: "base64" })
    });
    treeEntries.push({ path: ALBUMS_JSON_PAD, mode: "100644", type: "blob", sha: jsonBlob.sha });

    onVoortgang("Wijzigingen samenvoegen…");
    const nieuweTree = await gh("/git/trees", { method: "POST", body: JSON.stringify({ base_tree: baseTree, tree: treeEntries }) });

    onVoortgang("Opslaan…");
    const nieuweCommit = await gh("/git/commits", {
      method: "POST",
      body: JSON.stringify({ message: "Nieuwe fotogalerij: " + titel, tree: nieuweTree.sha, parents: [laatsteCommitSha] })
    });

    onVoortgang("Publiceren…");
    await gh("/git/refs/heads/" + BRANCH, { method: "PATCH", body: JSON.stringify({ sha: nieuweCommit.sha }) });

    return mapnaam;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    verzendKnop.disabled = true;
    zetStatus(statusToevoegen, "bezig", "Bezig…");
    try {
      await voegAlbumToe(
        titelVeld.value.trim(),
        bijschriftVeld.value.trim(),
        gekozenBestanden,
        (tekst) => zetStatus(statusToevoegen, "bezig", tekst)
      );
      zetStatus(statusToevoegen, "gelukt",
        "Gelukt! De galerij staat klaar. De website bouwt zichzelf nu opnieuw op — dat duurt meestal 1 à 2 minuten." +
        '<br><a class="knop" href="https://tpleintje.github.io/tpleintje/sfeerbeelden/" target="_blank" rel="noopener">Bekijk de sfeerbeelden-pagina</a>'
      );
      form.reset();
      gekozenBestanden = [];
      toonFotolijst();
      albumsCache = null;

  async function verwijderAlbum(mapnaam, titel, onVoortgang) {
    onVoortgang("Foto's van deze galerij ophalen…");
    const bestanden = await gh("/contents/" + SFEER_PAD + "/" + mapnaam);

    onVoortgang("Laatste stand van de website ophalen…");
    const ref = await gh("/git/ref/heads/" + BRANCH);
    const laatsteCommitSha = ref.object.sha;
    const laatsteCommit = await gh("/git/commits/" + laatsteCommitSha);
    const baseTree = laatsteCommit.tree.sha;

    const treeEntries = bestanden.map((f) => ({
      path: SFEER_PAD + "/" + mapnaam + "/" + f.name,
      mode: "100644",
      type: "blob",
      sha: null
    }));

    onVoortgang("Galerijinstelling opruimen…");
    const { data: huidigeData } = await haalAlbumsJson();
    const aantalVoor = (huidigeData.albums || []).length;
    huidigeData.albums = (huidigeData.albums || []).filter((a) => a.map !== mapnaam);
    if (huidigeData.albums.length !== aantalVoor) {
      const jsonBlob = await gh("/git/blobs", {
        method: "POST",
        body: JSON.stringify({ content: utf8NaarBase64(JSON.stringify(huidigeData, null, 2)), encoding: "base64" })
      });
      treeEntries.push({ path: ALBUMS_JSON_PAD, mode: "100644", type: "blob", sha: jsonBlob.sha });
    }

    onVoortgang("Wijzigingen samenvoegen…");
    const nieuweTree = await gh("/git/trees", { method: "POST", body: JSON.stringify({ base_tree: baseTree, tree: treeEntries }) });

    onVoortgang("Opslaan…");
    const nieuweCommit = await gh("/git/commits", {
      method: "POST",
      body: JSON.stringify({ message: "Fotogalerij verwijderd: " + titel, tree: nieuweTree.sha, parents: [laatsteCommitSha] })
    });

    onVoortgang("Publiceren…");
    await gh("/git/refs/heads/" + BRANCH, { method: "PATCH", body: JSON.stringify({ sha: nieuweCommit.sha }) });
  }

  async function bewerkAlbumOpslaan(mapnaam, titel, bijschrift, bestaandeFotos, teVerwijderen, nieuweBestanden, onVoortgang) {
    if (!mapnaam) throw new Error("Kies eerst een galerij.");
    const schoneTitel = (titel || "").trim();
    if (!schoneTitel) throw new Error("Geef een naam voor de galerij op.");

    const overgebleven = bestaandeFotos.filter((f) => !teVerwijderen.has(f.name));
    if (!overgebleven.length && !nieuweBestanden.length) {
      throw new Error("Een galerij moet minstens één foto behouden. Voeg een foto toe of verwijder minder foto's.");
    }

    onVoortgang("Laatste stand van de website ophalen…");
    const ref = await gh("/git/ref/heads/" + BRANCH);
    const laatsteCommitSha = ref.object.sha;
    const laatsteCommit = await gh("/git/commits/" + laatsteCommitSha);
    const baseTree = laatsteCommit.tree.sha;

    const treeEntries = [];

    // Verwijder gemarkeerde foto's (map/slug blijft ongewijzigd)
    for (const naam of teVerwijderen) {
      treeEntries.push({
        path: SFEER_PAD + "/" + mapnaam + "/" + naam,
        mode: "100644",
        type: "blob",
        sha: null
      });
    }

    const gebruikteNamen = new Set(overgebleven.map((f) => f.name));
    for (let i = 0; i < nieuweBestanden.length; i++) {
      const file = nieuweBestanden[i];
      onVoortgang("Nieuwe foto " + (i + 1) + " van " + nieuweBestanden.length + " voorbereiden…");
      let naam = sanitizeBestandsnaam(file.name);
      let uniekeNaam = naam;
      let teller = 2;
      while (gebruikteNamen.has(uniekeNaam)) {
        const punt = naam.lastIndexOf(".");
        uniekeNaam = punt > 0 ? naam.slice(0, punt) + "-" + teller + naam.slice(punt) : naam + "-" + teller;
        teller++;
      }
      gebruikteNamen.add(uniekeNaam);

      const base64 = await fileNaarBase64(file);
      const blob = await gh("/git/blobs", { method: "POST", body: JSON.stringify({ content: base64, encoding: "base64" }) });
      treeEntries.push({ path: SFEER_PAD + "/" + mapnaam + "/" + uniekeNaam, mode: "100644", type: "blob", sha: blob.sha });
    }

    onVoortgang("Galerijgegevens bijwerken…");
    const { data: huidigeData } = await haalAlbumsJson();
    huidigeData.albums = huidigeData.albums || [];
    let entry = huidigeData.albums.find((a) => a.map === mapnaam);
    if (!entry) {
      entry = { map: mapnaam };
      huidigeData.albums.push(entry);
    }
    entry.titel = schoneTitel;
    const schoonBijschrift = (bijschrift || "").trim();
    if (schoonBijschrift) {
      entry.bijschrift = schoonBijschrift;
    } else {
      delete entry.bijschrift;
    }
    if (Array.isArray(entry.foto_bijschriften) && teVerwijderen.size) {
      entry.foto_bijschriften = entry.foto_bijschriften.filter((fb) => !teVerwijderen.has(fb.bestandsnaam));
      if (!entry.foto_bijschriften.length) delete entry.foto_bijschriften;
    }

    const jsonBlob = await gh("/git/blobs", {
      method: "POST",
      body: JSON.stringify({ content: utf8NaarBase64(JSON.stringify(huidigeData, null, 2)), encoding: "base64" })
    });
    treeEntries.push({ path: ALBUMS_JSON_PAD, mode: "100644", type: "blob", sha: jsonBlob.sha });

    onVoortgang("Wijzigingen samenvoegen…");
    const nieuweTree = await gh("/git/trees", { method: "POST", body: JSON.stringify({ base_tree: baseTree, tree: treeEntries }) });

    onVoortgang("Opslaan…");
    const nieuweCommit = await gh("/git/commits", {
      method: "POST",
      body: JSON.stringify({ message: "Fotogalerij bewerkt: " + schoneTitel, tree: nieuweTree.sha, parents: [laatsteCommitSha] })
    });

    onVoortgang("Publiceren…");
    await gh("/git/refs/heads/" + BRANCH, { method: "PATCH", body: JSON.stringify({ sha: nieuweCommit.sha }) });
  }

  // ── Google Photos-import (Picker API) ──
  // Gekozen foto's komen als gewone File-objecten in dezelfde lijst als lokaal gekozen
  // foto's; de bestaande knop (Galerij toevoegen / Wijzigingen opslaan) doet de rest.
  const GP = window.TpGPhotos;
  const GP_CONFIG_URL = "/gphotos/config";
  const GP_PROXY_URL = "/gphotos/fetch";
  const GP_NIET_INGESTELD = "Google Photos-import nog niet ingesteld. Vraag Bruno om de Google-koppeling in te stellen.";
  const gpKnoppen = Array.from(document.querySelectorAll(".gphotos-knop"));
  const gpStatus = {
    toevoegen: document.getElementById("gphotosStatusToevoegen"),
    bewerken: document.getElementById("gphotosStatusBewerken")
  };
  let gpClientId = null;        // null = nog niet geladen, "" = niet ingesteld
  let gpConfigBelofte = null;
  let gpTokenClient = null;
  let gpToken = null;           // { waarde, verloopt } — enkel in het geheugen
  let gpTokenWachter = null;    // { resolve, reject }
  let gpBezig = false;
  let gpGeannuleerd = false;
  let gpVenster = null;

  function gpEscape(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function laadGpConfig() {
    if (gpConfigBelofte) return gpConfigBelofte;
    gpConfigBelofte = (async () => {
      try {
        const res = await fetch(GP_CONFIG_URL, { cache: "no-store", credentials: "same-origin" });
        const j = res.ok ? await res.json() : null;
        gpClientId = (j && typeof j.clientId === "string") ? j.clientId.trim() : "";
      } catch (e) {
        gpClientId = "";
      }
      if (gpClientId) laadGis();
      return gpClientId;
    })();
    return gpConfigBelofte;
  }

  function laadGis() {
    if (window.google && window.google.accounts && window.google.accounts.oauth2) return initGpTokenClient();
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true;
    s.onload = initGpTokenClient;
    document.head.appendChild(s);
  }

  function initGpTokenClient() {
    if (gpTokenClient || !gpClientId || !(window.google && window.google.accounts && window.google.accounts.oauth2)) return;
    gpTokenClient = window.google.accounts.oauth2.initTokenClient({
      client_id: gpClientId,
      scope: GP.SCOPE,
      callback: (resp) => {
        const w = gpTokenWachter; gpTokenWachter = null;
        if (!w) return;
        if (!resp || resp.error || !resp.access_token) {
          w.reject(new Error("Aanmelden bij Google mislukt" + (resp && resp.error ? " (" + resp.error + ")" : "") + "."));
          return;
        }
        gpToken = { waarde: resp.access_token, verloopt: Date.now() + (Number(resp.expires_in) || 3000) * 1000 - 60000 };
        w.resolve(gpToken.waarde);
      },
      error_callback: (err) => {
        const w = gpTokenWachter; gpTokenWachter = null;
        if (!w) return;
        const t = err && err.type;
        w.reject(new Error(t === "popup_closed" ? "Aanmelden bij Google geannuleerd."
          : t === "popup_failed_to_open" ? "Het Google-aanmeldvenster werd geblokkeerd. Sta pop-ups toe voor deze pagina en probeer opnieuw."
          : "Aanmelden bij Google mislukt."));
      }
    });
  }

  function geldigGpToken() {
    return gpToken && gpToken.verloopt > Date.now() ? gpToken.waarde : null;
  }

  // Moet synchroon vanuit de klik gebeuren (anders blokkeert de browser het pop-upvenster).
  function vraagGpToken() {
    return new Promise((resolve, reject) => {
      gpTokenWachter = { resolve, reject };
      gpTokenClient.requestAccessToken({ prompt: gpToken ? "" : undefined });
    });
  }

  function zetGpBezig(bezig) {
    gpBezig = bezig;
    gpKnoppen.forEach((k) => { k.disabled = bezig; });
  }

  function openPicker(uri) {
    const url = uri.replace(/\/+$/, "") + "/autoclose";
    if (gpVenster && !gpVenster.closed) {
      try { gpVenster.location.href = url; return true; } catch (e) {}
    }
    gpVenster = window.open(url, "tp-gphotos", "width=1000,height=760");
    return !!gpVenster;
  }

  function gpKlik(doel) {
    const statusEl = gpStatus[doel];
    if (gpBezig) return;
    if (!GP) { zetStatus(statusEl, "fout", "Google Photos-import kon niet laden. Herlaad de pagina."); return; }
    if (gpClientId === null) {
      zetStatus(statusEl, "bezig", "Even geduld…");
      laadGpConfig().then(() => { if (!gpClientId) zetStatus(statusEl, "fout", GP_NIET_INGESTELD); else zetStatus(statusEl, "bezig", "Klaar — klik nog eens op “Importeer uit Google Photos”."); });
      return;
    }
    if (!gpClientId) { zetStatus(statusEl, "fout", GP_NIET_INGESTELD); return; }
    if (!gpTokenClient) { zetStatus(statusEl, "bezig", "Google-aanmelding wordt nog geladen… probeer zo meteen opnieuw."); return; }

    zetGpBezig(true);
    gpGeannuleerd = false;
    let tokenBelofte;
    const token0 = geldigGpToken();
    if (token0) {
      // Al aangemeld: venster meteen (in de klik) openen, straks naar Google Photos sturen.
      gpVenster = window.open("", "tp-gphotos", "width=1000,height=760");
      try { if (gpVenster) gpVenster.document.body.innerHTML = "<p style='font-family:sans-serif'>Google Photos wordt geopend…</p>"; } catch (e) {}
      tokenBelofte = Promise.resolve(token0);
    } else {
      zetStatus(statusEl, "bezig", "Aanmelden bij Google…");
      tokenBelofte = vraagGpToken();
    }
    importeerUitGoogle(doel, statusEl, tokenBelofte).finally(() => zetGpBezig(false));
  }

  async function importeerUitGoogle(doel, statusEl, tokenBelofte) {
    let token = null;
    let sessie = null;
    try {
      token = await tokenBelofte;
      zetStatus(statusEl, "bezig", "Google Photos openen…");
      sessie = await GP.maakSessie(fetch, token);
      const geopend = openPicker(sessie.pickerUri);
      zetStatus(statusEl, "bezig",
        (geopend ? "Kies foto's in Google Photos… en klik daar op <b>Klaar</b>."
                 : "Klik op <b>Google Photos openen</b>, kies je foto's en klik daar op <b>Klaar</b>.") +
        '<br><a href="#" id="gpOpen_' + doel + '">Google Photos ' + (geopend ? "opnieuw " : "") + "openen</a> · " +
        '<button type="button" class="link" id="gpStop_' + doel + '">Annuleren</button>');
      const openLink = document.getElementById("gpOpen_" + doel);
      if (openLink) openLink.addEventListener("click", (e) => { e.preventDefault(); openPicker(sessie.pickerUri); });
      const stopKnop = document.getElementById("gpStop_" + doel);
      if (stopKnop) stopKnop.addEventListener("click", () => { gpGeannuleerd = true; });

      await GP.wachtOpKeuze(fetch, token, sessie, { geannuleerd: () => gpGeannuleerd });

      zetStatus(statusEl, "bezig", "Gekozen foto's oplijsten…");
      const items = await GP.lijstItems(fetch, token, sessie.id);
      const { fotos, overgeslagen } = GP.splitsFotos(items);
      if (!fotos.length) {
        throw new Error(overgeslagen ? "Je koos enkel video's; die worden niet geïmporteerd (enkel foto's)." : "Er werden geen foto's gekozen.");
      }
      zetStatus(statusEl, "bezig", fotos.length + " foto" + (fotos.length === 1 ? "" : "'s") + " ophalen…");
      const { bestanden, fouten } = await GP.downloadAlles(fetch, GP_PROXY_URL, token, fotos, {
        onVoortgang: (klaar, totaal) => zetStatus(statusEl, "bezig", totaal + " foto" + (totaal === 1 ? "" : "'s") + " ophalen… (" + klaar + "/" + totaal + ")")
      });
      const files = bestanden.map((b) => new File([b.blob], b.naam, { type: b.type || "image/jpeg" }));
      if (doel === "bewerken") voegBewerkBestandenToe(files); else voegBestandenToe(files);

      const knopNaam = doel === "bewerken" ? "Wijzigingen opslaan" : "Galerij toevoegen";
      let tekst = files.length + " foto" + (files.length === 1 ? "" : "'s") + " uit Google Photos toegevoegd. Klik op “" + knopNaam + "” om op te slaan.";
      if (overgeslagen) tekst += "<br>" + overgeslagen + " video" + (overgeslagen === 1 ? "" : "'s") + " overgeslagen (enkel foto's worden geïmporteerd).";
      if (fouten.length) tekst += "<br>" + fouten.length + " foto" + (fouten.length === 1 ? "" : "'s") + " konden niet opgehaald worden.";
      zetStatus(statusEl, files.length ? "gelukt" : "fout", tekst);
    } catch (err) {
      if (err && (err.status === 401 || err.status === 403)) gpToken = null;
      const msg = err && err.status === "geannuleerd" ? "Import geannuleerd."
        : (err && (err.status === 401 || err.status === 403)) ? "Google-aanmelding verlopen of geweigerd. Klik opnieuw op “Importeer uit Google Photos”."
        : (err && err.message) || "Er ging iets mis bij het importeren uit Google Photos.";
      zetStatus(statusEl, "fout", gpEscape(msg));
    } finally {
      if (sessie && token) GP.verwijderSessie(fetch, token, sessie.id);
      if (gpVenster && !gpVenster.closed && gpGeannuleerd) { try { gpVenster.close(); } catch (e) {} }
    }
  }

  gpKnoppen.forEach((k) => k.addEventListener("click", () => gpKlik(k.dataset.doel)));
  laadGpConfig();

  toonLoginStatus();
})();
</script>
</body>
</html>
